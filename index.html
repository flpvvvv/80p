<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="80points - Play for fun. Download rules and contact us.">
    <title>80points - Play for fun</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'slide-up': 'slideUp 0.5s ease-out forwards',
                        'gradient-x': 'gradientX 3s ease infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        gradientX: {
                            '0%, 100%': {
                                'background-size': '200% 200%',
                                'background-position': 'left center'
                            },
                            '50%': {
                                'background-size': '200% 200%',
                                'background-position': 'right center'
                            },
                        },
                    }
                }
            }
        }
    </script>
    <script>
        // Theme initialization
        (function() {
            const theme = localStorage.getItem('theme') || 
                         (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;700;800;900&display=swap');
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 transition-colors duration-300 selection:bg-blue-500 selection:text-white overflow-x-hidden">
    
    <!-- Background Gradients -->
    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-blue-400/20 blur-[100px] animate-float"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-purple-400/20 blur-[100px] animate-float" style="animation-delay: -3s;"></div>
    </div>

    <!-- Theme Toggle -->
    <div class="fixed top-6 right-6 z-50">
        <button id="themeToggle" 
                class="p-3 rounded-full glass-panel shadow-lg hover:scale-110 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-blue-500 group"
                aria-label="Toggle theme">
            <svg id="sunIcon" class="w-6 h-6 text-amber-500 hidden dark:block group-hover:rotate-90 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
            </svg>
            <svg id="moonIcon" class="w-6 h-6 text-slate-700 block dark:hidden group-hover:-rotate-12 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
            </svg>
        </button>
    </div>

    <!-- Main Content -->
    <main class="relative z-10 flex flex-col items-center justify-center min-h-screen px-4 py-12">
        
        <!-- Hero Section -->
        <div class="text-center mb-8 animate-fade-in">
            <div class="relative inline-block mb-6 animate-float">
                <div class="absolute inset-0 bg-blue-500/20 blur-2xl rounded-full"></div>
                <img src="public/80logo_blue.svg" alt="80points Logo" class="relative w-24 h-24 md:w-32 md:h-32 brightness-0 dark:invert drop-shadow-2xl">
            </div>
            <h1 class="text-2xl md:text-4xl lg:text-5xl font-display font-bold mb-4 tracking-tight text-slate-900 dark:text-white flex flex-wrap justify-center items-center gap-x-3 gap-y-1">
                <span>80points</span>
                <span class="hidden sm:inline text-slate-400">-</span>
                <span class="font-black bg-clip-text text-transparent bg-gradient-to-r from-blue-600 via-purple-600 to-blue-600 dark:from-blue-400 dark:via-purple-400 dark:to-blue-400 animate-gradient-x bg-[length:200%_auto]">Play for fun</span>
            </h1>
        </div>

        <!-- Main Card -->
        <div class="w-full max-w-xl animate-slide-up" style="animation-delay: 0.2s;">
            
            <!-- Download Card -->
            <div class="glass-panel rounded-3xl p-8 md:p-12 hover:shadow-2xl transition-all duration-300 group text-center">
                <div class="w-16 h-16 mx-auto bg-blue-100 dark:bg-blue-900/30 rounded-2xl flex items-center justify-center mb-8 group-hover:scale-110 transition-transform duration-300">
                    <svg class="w-8 h-8 text-blue-600 dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                    </svg>
                </div>
                <h3 class="text-3xl font-display font-bold mb-4">Game Rules</h3>
                <p class="text-lg text-slate-600 dark:text-slate-400 mb-10 leading-relaxed">
                    Ready to start? Download the official guide to master the game.
                    <span class="block mt-2 text-sm text-slate-500 dark:text-slate-500 font-medium">
                        *Currently available in Chinese only
                    </span>
                </p>
                <a href="public/80P_SCN_V2.pdf" 
                   download="80points_rules.pdf"
                   class="inline-flex items-center justify-center w-full py-4 px-8 text-lg bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-2xl transition-all duration-300 shadow-xl shadow-blue-600/20 hover:shadow-blue-600/40 hover:-translate-y-1">
                    <span>Download PDF</span>
                    <svg class="w-6 h-6 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                </a>
            </div>

            <!-- Contact Link -->
            <div class="mt-12 text-center">
                <a href="mailto:FiveLayerPork@gmail.com" 
                   class="inline-flex items-center space-x-2 text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors duration-300 group">
                    <svg class="w-5 h-5 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                    </svg>
                    <span class="font-medium">Get in touch via email</span>
                </a>
            </div>
        </div>

        <!-- Footer -->
        <footer class="mt-20 text-center animate-slide-up" style="animation-delay: 0.4s;">
            <p class="text-lg font-display font-medium text-slate-600 dark:text-slate-400 mb-4">Have fun ☺</p>
            <div class="flex items-center justify-center space-x-4 text-2xl mb-6 opacity-80">
                <span class="text-slate-800 dark:text-slate-200 hover:-translate-y-1 transition-transform cursor-default">♠</span>
                <span class="text-red-500 hover:-translate-y-1 transition-transform cursor-default">♥</span>
                <span class="text-slate-800 dark:text-slate-200 hover:-translate-y-1 transition-transform cursor-default">♣</span>
                <span class="text-red-500 hover:-translate-y-1 transition-transform cursor-default">♦</span>
            </div>
            <p class="text-sm text-slate-400 dark:text-slate-500">
                &copy; 2025 80p. From FLP.
            </p>
        </footer>

    </main>

    <!-- Theme Toggle Script -->
    <script>
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;

        function toggleTheme() {
            const isDark = html.classList.contains('dark');
            if (isDark) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        themeToggle.addEventListener('click', toggleTheme);

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            if (!localStorage.getItem('theme')) {
                if (e.matches) {
                    html.classList.add('dark');
                } else {
                    html.classList.remove('dark');
                }
            }
        });
    </script>
</body>
</html>
