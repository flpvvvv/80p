<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="80points - Play for fun. Download rules and contact us.">
    <title>80points - Play for fun</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                    animation: {
                        'float-slow': 'float 8s ease-in-out infinite',
                        'float-medium': 'float 6s ease-in-out infinite',
                        'float-fast': 'float 4s ease-in-out infinite',
                        'spin-slow': 'spin 12s linear infinite',
                        'deal': 'deal 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
                        'gradient-x': 'gradientX 3s ease infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
                            '50%': { transform: 'translateY(-20px) rotate(5deg)' },
                        },
                        deal: {
                            '0%': { opacity: '0', transform: 'translateY(100px) scale(0.9) rotateX(-20deg)' },
                            '100%': { opacity: '1', transform: 'translateY(0) scale(1) rotateX(0)' },
                        },
                        gradientX: {
                            '0%, 100%': {
                                'background-size': '200% 200%',
                                'background-position': 'left center'
                            },
                            '50%': {
                                'background-size': '200% 200%',
                                'background-position': 'right center'
                            },
                        },
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;700;800;900&display=swap');
        
        .perspective-1000 {
            perspective: 1000px;
        }
        
        .card-3d {
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }
        
        .glass-morphism {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }
        
        .dark .glass-morphism {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .suit-bg {
            position: absolute;
            pointer-events: none;
            z-index: 0;
            opacity: 0.6;
        }
        
        .dark .suit-bg {
            opacity: 0.4;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #334155;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-100 dark:bg-[#0B1120] text-slate-900 dark:text-slate-100 transition-colors duration-500 overflow-x-hidden selection:bg-indigo-500 selection:text-white">

    <!-- Dynamic Background Container -->
    <div id="background-container" class="fixed inset-0 overflow-hidden pointer-events-none">
        <!-- Gradients -->
        <div class="absolute top-[-20%] left-[-10%] w-[60%] h-[60%] rounded-full bg-indigo-400/30 dark:bg-indigo-600/20 blur-[120px] animate-float-slow"></div>
        <div class="absolute bottom-[-20%] right-[-10%] w-[60%] h-[60%] rounded-full bg-fuchsia-400/30 dark:bg-fuchsia-600/20 blur-[120px] animate-float-medium" style="animation-delay: -2s;"></div>
        <!-- Suits will be injected here by JS -->
    </div>

    <!-- Controls (Floating) -->
    <div class="fixed top-6 right-6 z-50 flex gap-3">
        <!-- Language Toggle -->
        <button id="langToggle" 
                class="w-12 h-12 rounded-full glass-morphism hover:scale-110 transition-all duration-300 group relative overflow-hidden flex items-center justify-center"
                aria-label="Toggle language">
            <div class="absolute inset-0 bg-gradient-to-tr from-indigo-500 to-fuchsia-500 opacity-0 group-hover:opacity-20 transition-opacity duration-300"></div>
            <span id="langText" class="font-bold text-sm text-slate-700 dark:text-slate-200">中</span>
        </button>

        <!-- Theme Toggle -->
        <button id="themeToggle" 
                class="p-3 rounded-full glass-morphism hover:scale-110 transition-all duration-300 group relative overflow-hidden"
                aria-label="Toggle theme">
            <div class="absolute inset-0 bg-gradient-to-tr from-indigo-500 to-fuchsia-500 opacity-0 group-hover:opacity-20 transition-opacity duration-300"></div>
            <svg id="sunIcon" class="w-6 h-6 text-amber-500 hidden dark:block group-hover:rotate-90 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
            </svg>
            <svg id="moonIcon" class="w-6 h-6 text-slate-700 block dark:hidden group-hover:-rotate-12 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
            </svg>
        </button>
    </div>

    <!-- Main Content Wrapper -->
    <main class="relative z-10 min-h-screen flex items-center justify-center p-4 perspective-1000">
        
        <!-- The "Card" -->
        <div id="mainCard" class="w-full max-w-4xl glass-morphism rounded-[2.5rem] p-8 md:p-12 lg:p-16 relative card-3d opacity-0 animate-deal">
            
            <!-- Decorative Border Gradient -->
            <div class="absolute inset-0 rounded-[2.5rem] p-[1px] bg-gradient-to-br from-white/50 via-transparent to-white/20 dark:from-white/10 dark:via-transparent dark:to-white/5 pointer-events-none -z-10"></div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
                
                <!-- Left Column: Brand & Intro -->
                <div class="text-center lg:text-left space-y-8">
                    <div class="relative inline-block group cursor-default">
                        <div class="absolute inset-0 bg-indigo-500/30 blur-3xl rounded-full group-hover:bg-indigo-500/50 transition-colors duration-500"></div>
                        <img src="public/80logo_blue.svg" alt="80points Logo" class="relative w-32 h-32 mx-auto lg:mx-0 brightness-0 dark:invert drop-shadow-2xl transform group-hover:scale-110 group-hover:rotate-3 transition-all duration-500">
                    </div>
                    
                    <div>
                        <h1 class="text-5xl md:text-7xl font-display font-black tracking-tighter mb-2 text-transparent bg-clip-text bg-gradient-to-r from-slate-900 via-indigo-800 to-slate-900 dark:from-white dark:via-indigo-200 dark:to-white animate-gradient-x bg-[length:200%_auto]" data-i18n="mainTitle">
                            80points
                        </h1>
                        <p class="text-xl md:text-2xl font-medium text-slate-600 dark:text-slate-400 flex items-center justify-center lg:justify-start gap-3">
                            <span class="w-8 h-[2px] bg-indigo-500 rounded-full"></span>
                            <span data-i18n="slogan">Play for fun</span>
                        </p>
                    </div>

                    <div class="flex justify-center lg:justify-start gap-6 text-3xl opacity-60 hover:opacity-100 transition-opacity duration-300">
                        <span class="transform hover:-translate-y-2 transition-transform duration-300 cursor-help" title="Spades" data-i18n-title="spades">♠</span>
                        <span class="text-red-500 transform hover:-translate-y-2 transition-transform duration-300 delay-75 cursor-help" title="Hearts" data-i18n-title="hearts">♥</span>
                        <span class="transform hover:-translate-y-2 transition-transform duration-300 delay-150 cursor-help" title="Clubs" data-i18n-title="clubs">♣</span>
                        <span class="text-red-500 transform hover:-translate-y-2 transition-transform duration-300 delay-200 cursor-help" title="Diamonds" data-i18n-title="diamonds">♦</span>
                    </div>
                </div>

                <!-- Right Column: Action -->
                <div class="relative">
                    <!-- Action Card -->
                    <div class="bg-white/50 dark:bg-slate-800/50 rounded-3xl p-8 border border-white/40 dark:border-white/5 shadow-xl backdrop-blur-sm hover:transform hover:scale-[1.02] transition-all duration-300 group">
                        <div class="absolute -top-6 -right-6 w-20 h-20 bg-yellow-400 rounded-full blur-2xl opacity-20 group-hover:opacity-40 transition-opacity"></div>
                        
                        <h2 class="text-2xl font-bold mb-4 font-display" data-i18n="rulesTitle">Game Rules</h2>
                        <p class="text-slate-600 dark:text-slate-300 mb-8 leading-relaxed">
                            <span data-i18n="rulesDesc">Master the strategy. Download the official guide and start playing today.</span>
                            <br>
                            <span class="text-xs font-mono text-indigo-500 dark:text-indigo-400 mt-2 block bg-indigo-50 dark:bg-indigo-900/30 w-fit px-2 py-1 rounded" data-i18n="versionNote">
                                V2.0 • Chinese Only
                            </span>
                        </p>

                        <a href="public/80P_SCN_V2.pdf" 
                           download="80points_rules.pdf"
                           class="relative w-full group/btn overflow-hidden rounded-xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold text-lg py-4 px-8 flex items-center justify-center gap-3 shadow-lg hover:shadow-indigo-500/25 transition-all duration-300">
                            <div class="absolute inset-0 w-full h-full bg-gradient-to-r from-indigo-500 via-purple-500 to-indigo-500 opacity-0 group-hover/btn:opacity-100 transition-opacity duration-300"></div>
                            <span class="relative z-10" data-i18n="downloadBtn">Download PDF</span>
                            <svg class="w-5 h-5 relative z-10 group-hover/btn:translate-y-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                            </svg>
                        </a>

                        <div class="mt-6 text-center">
                            <a href="mailto:FiveLayerPork@gmail.com" class="text-sm text-slate-500 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors" data-i18n="contact">
                                Need help? Contact us
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer inside card -->
            <div class="mt-12 pt-8 border-t border-slate-200/50 dark:border-slate-700/50 text-center lg:text-left flex flex-col lg:flex-row justify-between items-center gap-4 text-sm text-slate-500">
                <p data-i18n="crafted">&copy; 2025 80p. Crafted by FLP.</p>
                <p class="font-mono text-xs opacity-70" data-i18n="est">EST. 2025</p>
            </div>
        </div>

    </main>

    <script>
        // Theme Logic
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;

        // Initialize theme
        const savedTheme = localStorage.getItem('theme') || 
                          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (savedTheme === 'dark') html.classList.add('dark');

        themeToggle.addEventListener('click', () => {
            html.classList.toggle('dark');
            localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
        });

        // 3D Tilt Effect
        const card = document.getElementById('mainCard');
        const container = document.querySelector('main');

        container.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        container.addEventListener('mouseenter', () => {
            card.style.transition = 'none';
        });

        container.addEventListener('mouseleave', () => {
            card.style.transition = 'transform 0.5s ease';
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });

        // Floating Suits Background Generator
        const suits = ['♠', '♥', '♣', '♦'];
        const bgContainer = document.getElementById('background-container');
        const suitCount = 20;

        if (bgContainer) {
            for (let i = 0; i < suitCount; i++) {
                const el = document.createElement('div');
                el.innerText = suits[Math.floor(Math.random() * suits.length)];
                el.className = 'suit-bg text-slate-400 dark:text-slate-600 font-serif select-none';
                
                // Random properties
                const size = Math.random() * 100 + 20; // 20px to 120px
                const left = Math.random() * 100;
                const top = Math.random() * 100;
                const duration = Math.random() * 10 + 10; // 10s to 20s
                const delay = Math.random() * -20;
                
                el.style.fontSize = `${size}px`;
                el.style.left = `${left}%`;
                el.style.top = `${top}%`;
                el.style.animation = `float ${duration}s ease-in-out infinite`;
                el.style.animationDelay = `${delay}s`;
                
                if (['♥', '♦'].includes(el.innerText)) {
                    el.classList.add('text-red-400', 'dark:text-red-800');
                    el.classList.remove('text-slate-400', 'dark:text-slate-600');
                }

                bgContainer.appendChild(el);
            }
        }

        // Translation Logic
        const translations = {
            en: {
                title: "80points - Play for fun",
                metaDesc: "80points - Play for fun. Download rules and contact us.",
                mainTitle: "80 points",
                slogan: "Play for fun",
                rulesTitle: "Game Rules",
                rulesDesc: "Master the strategy. Download the official guide and start playing today.",
                versionNote: "V2.0 • Chinese Only",
                downloadBtn: "Download PDF",
                contact: "Need help? Contact us",
                crafted: "© 2026 80p. Crafted by FLP.",
                est: "EST. 2013",
                spades: "Spades",
                hearts: "Hearts",
                clubs: "Clubs",
                diamonds: "Diamonds"
            },
            zh: {
                title: "80分 - 为快乐而玩",
                metaDesc: "80分 - 为快乐而玩。下载规则并联系我们。",
                mainTitle: "80 分",
                slogan: "为快乐而玩",
                rulesTitle: "游戏规则",
                rulesDesc: "掌握策略。下载官方指南，即刻开始游戏。",
                versionNote: "V2.0 • 仅中文版",
                downloadBtn: "下载 PDF",
                contact: "需要帮助？联系我们",
                crafted: "© 2026 80p. FLP 制作。",
                est: "成立于 20213",
                spades: "黑桃",
                hearts: "红桃",
                clubs: "梅花",
                diamonds: "方块"
            }
        };

        const langToggle = document.getElementById('langToggle');
        const langText = document.getElementById('langText');
        
        // Detect Language
        // Priority: LocalStorage > Browser Language > Default (en)
        const getPreferredLanguage = () => {
            const savedLang = localStorage.getItem('language');
            if (savedLang) return savedLang;
            
            const browserLang = navigator.language || navigator.userLanguage;
            if (browserLang.toLowerCase().startsWith('zh')) return 'zh';
            
            return 'en';
        };

        let currentLang = getPreferredLanguage();

        const updateContent = (lang) => {
            const t = translations[lang];
            
            // Update Title and Meta
            document.title = t.title;
            const metaDesc = document.querySelector('meta[name="description"]');
            if (metaDesc) metaDesc.setAttribute('content', t.metaDesc);

            // Update Text Content
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.textContent = t[key];
            });

            // Update Titles (for suits)
            document.querySelectorAll('[data-i18n-title]').forEach(el => {
                const key = el.getAttribute('data-i18n-title');
                if (t[key]) el.setAttribute('title', t[key]);
            });

            // Update Toggle Button Text
            langText.textContent = lang === 'en' ? '中' : 'EN';
            
            // Save preference
            localStorage.setItem('language', lang);
            
            // Update html lang attribute
            document.documentElement.lang = lang;
        };

        // Initialize
        updateContent(currentLang);

        langToggle.addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'zh' : 'en';
            updateContent(currentLang);
        });
    </script>
</body>
</html>
